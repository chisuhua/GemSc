# CppTLM CI/CD — GitHub Actions
name: CppTLM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================================
  # 构建与测试
  # ============================================================================
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
        use-asan: [OFF, ON]
        exclude:
          # ASan 仅对 Debug 构建生效（Release 下效果差且无意义）
          - build-type: Release
            use-asan: ON

    name: Build (${{ matrix.build-type }}, ASan=${{ matrix.use-asan }})

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential ccache ninja-build

    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ matrix.build-type }}-${{ matrix.use-asan }}
        max-size: 200M

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DUSE_ASAN=${{ matrix.use-asan }}

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: |
        if [ -f build/bin/cpptlm_tests ]; then
          cd build && ctest --output-on-failure -j4
        else
          echo "Test binary not found"
          exit 1
        fi

    - name: Run E2E simulation tests (Release only)
      if: matrix.build-type == 'Release'
      run: ./test.sh --e2e

    - name: Run quick test suite (Python + key C++)
      if: matrix.build-type == 'Release'
      run: |
        python3 -m pip install --quiet networkx pydot pydantic pytest
        ./test.sh --quick

  # PTX-EMU 集成验证：仅覆盖 PTXIR image H2D DMA；不执行 kernel/CuTe 程序。
  # 必须装 CUDA toolkit: PTX-EMU 子模块 CMakeLists.txt 强制 enable_language(CUDA)
  # + find_package(CUDAToolkit REQUIRED)。CI 不用 source external/PTX-EMU/env.sh
  # (env.sh 是 dev 本地工具, 用 ${BASH_SOURCE[0]} 算路径, 跨 submodule 版本不稳)。
  ptx-emu-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: PTX-EMU (Release, PTXIR H2D DMA only)

    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install CUDA 12.8 (manual, Jimver action only ships 12.6.1)
      # Jimver/cuda-toolkit@v0.2.20 hardcodes cuda 12.6.1, doesn't accept 12.8
      # via cuda-version input (warning: 'Unexpected input cuda-version').
      # CUDA 12.8+ required for sm_100 (PTX-EMU default DEFAULT_CUDA_ARCH=100).
      # Use official NVIDIA cuda-keyring + apt-get cuda-toolkit-12-8.
      run: |
        wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt-get update
        sudo apt-get install -y cuda-toolkit-12-8
        rm cuda-keyring_1.1-1_all.deb

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential ccache ninja-build

    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ptx-emu-release
        max-size: 500M

    - name: Build and run PTX-EMU H2D DMA tests
      env:
        # cuda-toolkit-12-8 installs to /usr/local/cuda-12.8, with /usr/local/cuda symlink
        CUDA_PATH: /usr/local/cuda
        CUDA_HOME: /usr/local/cuda
        PATH: /usr/local/cuda/bin:${{ env.PATH }}
      run: ./test.sh --mode ptx-emu

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ runner.os }}-${{ matrix.build-type }}-${{ matrix.use-asan }}-${{ github.run_id }}
        path: build/Testing/
        retention-days: 7

  # ============================================================================
  # 代码格式检查
  # ============================================================================
  code-format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install clang-format
      # Pin to clang-format-22 (matches .clang-format "版本策略" 注释).
      # ubuntu-latest 默认 clang-format 版本会随镜像变化,
      # 导致本地与 CI 漂移, 引发大量假阳性.
      # Ubuntu noble 默认仓库不提供 clang-format-22, 必须从 LLVM 官方仓库装.
      # 必须 --force 覆盖系统默认 clang-format-18 symlink, 否则 PATH 中 clang-format 仍指 18.
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y clang-format-22
        sudo update-alternatives --force --install /usr/bin/clang-format clang-format /usr/bin/clang-format-22 200
        sudo update-alternatives --set clang-format /usr/bin/clang-format-22
        clang-format --version
    - name: Check format
      run: |
        chmod +x ./scripts/build/format.sh
        ./scripts/build/format.sh --check
